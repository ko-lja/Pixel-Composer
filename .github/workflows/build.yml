name: Build Pixel Composer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provide GameMaker SDF prefab
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Adeptus-Dominus/ChapterMaster.git "$env:RUNNER_TEMP\chaptermaster"
          git -C "$env:RUNNER_TEMP\chaptermaster" sparse-checkout set prefabs/io.gamemaker.sdfshaders-1.0.0
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\prefabs" | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\chaptermaster\prefabs\io.gamemaker.sdfshaders-1.0.0" "$env:GITHUB_WORKSPACE\prefabs\io.gamemaker.sdfshaders-1.0.0"

      - name: Setup GameMaker / Igor
        id: igor
        uses: bscotch/igor-setup@v1.4.2
        with:
          access-key: ${{ secrets.ACCESS_KEY }}
          runtime-version: 2026.100.0.1098
          modules: windows
          cache: true

      - name: Build Pixel Composer
        id: build
        uses: bscotch/igor-build@v1.3.3
        with:
          user-dir: ${{ steps.igor.outputs.user-dir }}
          yyp-path: ${{ github.workspace }}/PixelComposer.yyp
          platform: windows
          config: Default
          yyc: true
          name: PixelComposer.zip
          save-logs: true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PixelComposer-Windows
          path: ${{ steps.build.outputs.out-dir }}
          if-no-files-found: error
