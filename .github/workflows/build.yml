name: Build Pixel Composer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provide GameMaker SDF prefab
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Adeptus-Dominus/ChapterMaster.git "$env:RUNNER_TEMP\chaptermaster"
          git -C "$env:RUNNER_TEMP\chaptermaster" sparse-checkout set prefabs/io.gamemaker.sdfshaders-1.0.0
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\prefabs" | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\chaptermaster\prefabs\io.gamemaker.sdfshaders-1.0.0" "$env:GITHUB_WORKSPACE\prefabs\io.gamemaker.sdfshaders-1.0.0"

      - name: Restore compatible Apollo extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Pixel Composer's Apollo.yy still describes the legacy Apollo API and
          # GML helper files. Building current YAL-GameMaker/Apollo produces a
          # different API and leaves the helper .gml files missing, which makes
          # the packaged app fail at runtime (for example: lua_call not found).
          # Restore the exact extension payload that Pixel Composer historically
          # shipped alongside this API, while keeping the current Apollo.yy.
          $apolloCommit = 'f02c1fd2179e134b543aeff25053de486b2e0485'
          $legacy = Join-Path $env:RUNNER_TEMP 'pixel-composer-legacy'
          $legacyApollo = Join-Path $legacy 'extensions\Apollo'
          $currentApollo = Join-Path $env:GITHUB_WORKSPACE 'extensions\Apollo'
          $currentYy = Join-Path $currentApollo 'Apollo.yy'
          $savedYy = Join-Path $env:RUNNER_TEMP 'Apollo.yy'

          Copy-Item -Force $currentYy $savedYy

          git init $legacy
          git -C $legacy remote add origin https://github.com/Ttanasart-pt/Pixel-Composer.git
          git -C $legacy fetch --depth 1 origin $apolloCommit
          git -C $legacy checkout FETCH_HEAD -- extensions/Apollo

          if (-not (Test-Path $legacyApollo)) {
            throw "Legacy Apollo payload was not found at commit $apolloCommit."
          }

          Copy-Item -Recurse -Force "$legacyApollo\*" $currentApollo
          Copy-Item -Force $savedYy $currentYy

          # Apollo.yy is GameMaker JSON with trailing commas, so use its filename
          # declarations instead of trying to parse it as strict JSON.
          $yyText = Get-Content -Raw $currentYy
          $declaredFiles = [regex]::Matches($yyText, '"filename"\s*:\s*"([^"]+)"') |
            ForEach-Object { $_.Groups[1].Value } |
            Where-Object { $_ } |
            Sort-Object -Unique

          foreach ($file in $declaredFiles) {
            $path = Join-Path $currentApollo $file
            if (-not (Test-Path $path)) {
              throw "Apollo.yy references missing extension file: $file"
            }
          }

          foreach ($file in @('Apollo.dll', 'Apollo_x64.dll', 'apollo_call.gml', 'apollo_core.gml')) {
            $path = Join-Path $currentApollo $file
            if (-not (Test-Path $path)) {
              throw "Required Apollo compatibility file is missing: $file"
            }
          }

          $apolloHash = (Get-FileHash (Join-Path $currentApollo 'Apollo_x64.dll') -Algorithm SHA256).Hash
          "APOLLO_X64_SHA256=$apolloHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using legacy Apollo x64 SHA256: $apolloHash"

      - name: Provide local-only extension key stubs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # These two files are deliberately excluded by extensions/.gitignore
          # because upstream keeps deployment credentials in them. The public
          # project still registers their init hooks, though, so a clean clone
          # otherwise builds an executable that fails immediately at startup.
          #
          # For public/CI builds, provide non-secret fallbacks. Patreon-backed
          # online verification is unavailable without the owner's real keys,
          # but the editor itself can start and run.
          $patreonFile = Join-Path $env:GITHUB_WORKSPACE 'extensions\patreon_key\patreon_key.gml'
          @'
          function patreon_init_keys() {
              global.PATREON_ACTIVATION_KEYS = "";
              global.PATREON_EMAIL_TOKENS = "";
          }
          '@ | Set-Content -Encoding utf8 $patreonFile

          $privateKeysFile = Join-Path $env:GITHUB_WORKSPACE 'extensions\PRIVATE_KEYS\PRIVATE_KEYS.gml'
          @'
          function __init_private_keys() {
              // Intentionally empty for public builds.
          }
          '@ | Set-Content -Encoding utf8 $privateKeysFile

          foreach ($file in @($patreonFile, $privateKeysFile)) {
            if (-not (Test-Path $file)) {
              throw "Required public-build extension stub was not created: $file"
            }
          }

      - name: Setup GameMaker / Igor
        id: igor
        uses: bscotch/igor-setup@v1.4.2
        with:
          access-key: ${{ secrets.ACCESS_KEY }}
          runtime-version: 2026.100.0.1098
          modules: windows
          cache: true

      - name: Build Pixel Composer
        id: build
        uses: bscotch/igor-build@v1.3.3
        with:
          user-dir: ${{ steps.igor.outputs.user-dir }}
          yyp-path: ${{ github.workspace }}/PixelComposer.yyp
          platform: windows
          config: Itch
          yyc: false
          name: PixelComposer.zip
          save-logs: true

      - name: Validate Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'pixelcomposer-package'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Expand-Archive -Force "$env:GITHUB_WORKSPACE\out\PixelComposer.zip" $packageDir

          $exe = Get-ChildItem -Path $packageDir -Recurse -Filter 'PixelComposer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'PixelComposer.exe was not found in the GameMaker package.' }
          $appRoot = $exe.Directory.FullName
          "APP_ROOT=$appRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $macLibraries = @(Get-ChildItem -Path $appRoot -Recurse -File -Include '*.dylib')
          if ($macLibraries.Count -gt 0) {
            $names = ($macLibraries | ForEach-Object FullName) -join "`n"
            throw "macOS libraries were included in the Windows package:`n$names"
          }

          $dataWin = Join-Path $appRoot 'data.win'
          if (-not (Test-Path $dataWin)) { throw 'data.win was not found in the GameMaker package.' }
          $bytes = [System.IO.File]::ReadAllBytes($dataWin)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii.Contains('libmacWindowManager.dylib')) {
            throw 'The Windows data.win still references libmacWindowManager.dylib.'
          }

          $packagedApollo = Join-Path $appRoot 'Apollo_x64.dll'
          if (-not (Test-Path $packagedApollo)) {
            throw 'Apollo_x64.dll was not included in the Windows package.'
          }
          $packagedApolloHash = (Get-FileHash $packagedApollo -Algorithm SHA256).Hash
          if ($packagedApolloHash -ne $env:APOLLO_X64_SHA256) {
            throw "Packaged Apollo_x64.dll does not match the known-compatible source payload. Expected $env:APOLLO_X64_SHA256, got $packagedApolloHash"
          }

      - name: Smoke test Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pixelcomposer-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pixelcomposer-stderr.log'
          $process = Start-Process -FilePath "$env:APP_ROOT\PixelComposer.exe" -WorkingDirectory $env:APP_ROOT -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 10

          $output = ''
          if (Test-Path $stdout) { $output += Get-Content -Raw $stdout }
          if (Test-Path $stderr) { $output += "`n" + (Get-Content -Raw $stderr) }
          if ($output -match 'Unable to find function|Could not locate initialization function') {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Pixel Composer reported a missing extension function during startup:`n$output"
          }

          if ($process.HasExited) {
            throw "PixelComposer.exe exited during the startup smoke test with code $($process.ExitCode).`n$output"
          }
          Stop-Process -Id $process.Id -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress

          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

          $issPath = Join-Path $env:RUNNER_TEMP 'PixelComposer.iss'
          @"
          [Setup]
          AppId={{E835F723-4E41-47BE-9E63-0E0EF648CB58}
          AppName=Pixel Composer
          AppVersion=1.21.10.001
          AppPublisher=MakhamDev
          DefaultDirName={localappdata}\Programs\Pixel Composer
          DefaultGroupName=Pixel Composer
          UninstallDisplayIcon={app}\PixelComposer.exe
          OutputDir=$installerDir
          OutputBaseFilename=PixelComposer-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Files]
          Source: "$env:APP_ROOT\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Pixel Composer"; Filename: "{app}\PixelComposer.exe"
          Name: "{autodesktop}\Pixel Composer"; Filename: "{app}\PixelComposer.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\PixelComposer.exe"; Description: "Launch Pixel Composer"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding utf8 $issPath

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = Join-Path $installerDir 'PixelComposer-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'PixelComposer-Setup.exe was not produced.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PixelComposer-Windows-Installer
          path: installer/PixelComposer-Setup.exe
          if-no-files-found: error

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: PixelComposer-Windows-Portable
          path: out/PixelComposer.zip
          if-no-files-found: error
