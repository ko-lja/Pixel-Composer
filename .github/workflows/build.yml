name: Build Pixel Composer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provide GameMaker SDF prefab
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Adeptus-Dominus/ChapterMaster.git "$env:RUNNER_TEMP\chaptermaster"
          git -C "$env:RUNNER_TEMP\chaptermaster" sparse-checkout set prefabs/io.gamemaker.sdfshaders-1.0.0
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\prefabs" | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\chaptermaster\prefabs\io.gamemaker.sdfshaders-1.0.0" "$env:GITHUB_WORKSPACE\prefabs\io.gamemaker.sdfshaders-1.0.0"

      - name: Build Apollo extension from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          choco install haxe --version=4.3.4 -y --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment

          $tools = Join-Path $env:RUNNER_TEMP 'apollo-tools'
          $apollo = Join-Path $tools 'Apollo'
          $gmlcpp = Join-Path $tools 'GmlCppExtFuncs'
          $gmxgen = Join-Path $tools 'GmxGen'

          git clone --depth 1 https://github.com/YAL-GameMaker/Apollo.git $apollo
          git clone --depth 1 https://github.com/YAL-GameMaker-Tools/GmlCppExtFuncs.git $gmlcpp
          git clone --depth 1 https://github.com/YAL-GameMaker-Tools/GmxGen.git $gmxgen

          Push-Location $gmlcpp
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          haxe -cp src -neko bin/GmlCppExtFuncs.n -main CppGen
          nekotools boot bin/GmlCppExtFuncs.n
          Pop-Location

          Push-Location $gmxgen
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          haxe -cp src -main GenMain -neko bin/GmxGen.n
          nekotools boot bin/GmxGen.n
          Pop-Location

          $env:PATH = "$gmlcpp\bin;$gmxgen\bin;$env:PATH"

          $luaArchive = Join-Path $tools 'lua-5.4.4.tar.gz'
          Invoke-WebRequest 'https://www.lua.org/ftp/lua-5.4.4.tar.gz' -OutFile $luaArchive
          tar -xzf $luaArchive -C $tools
          New-Item -ItemType Directory -Force -Path "$apollo\Lua" | Out-Null
          Copy-Item -Force "$tools\lua-5.4.4\src\*" "$apollo\Lua\"

          $project = Join-Path $apollo 'Apollo\Apollo.vcxproj'
          (Get-Content -Raw $project).Replace('<PlatformToolset>v143</PlatformToolset>', '<PlatformToolset>v145</PlatformToolset>') | Set-Content -Encoding utf8 $project

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) { throw 'Visual Studio/MSBuild installation was not found.' }
          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'

          & $msbuild "$apollo\Apollo.sln" /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Apollo x64 build failed with exit code $LASTEXITCODE" }

          $apollo64 = Join-Path $apollo 'x64\Release\Apollo.dll'
          if (-not (Test-Path $apollo64)) { throw "Apollo x64 DLL not found at $apollo64" }

          Copy-Item -Force $apollo64 "$env:GITHUB_WORKSPACE\extensions\Apollo\Apollo.dll"
          Copy-Item -Force $apollo64 "$env:GITHUB_WORKSPACE\extensions\Apollo\Apollo_x64.dll"

      - name: Setup GameMaker / Igor
        id: igor
        uses: bscotch/igor-setup@v1.4.2
        with:
          access-key: ${{ secrets.ACCESS_KEY }}
          runtime-version: 2026.100.0.1098
          modules: windows
          cache: true

      - name: Build Pixel Composer
        id: build
        uses: bscotch/igor-build@v1.3.3
        with:
          user-dir: ${{ steps.igor.outputs.user-dir }}
          yyp-path: ${{ github.workspace }}/PixelComposer.yyp
          platform: windows
          config: Default
          yyc: false
          name: PixelComposer.zip
          save-logs: true

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress

          $packageDir = Join-Path $env:RUNNER_TEMP 'pixelcomposer-package'
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Force -Path $packageDir, $installerDir | Out-Null
          Expand-Archive -Force "$env:GITHUB_WORKSPACE\out\PixelComposer.zip" $packageDir

          $exe = Get-ChildItem -Path $packageDir -Recurse -Filter 'PixelComposer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'PixelComposer.exe was not found in the GameMaker package.' }
          $appRoot = $exe.Directory.FullName

          $issPath = Join-Path $env:RUNNER_TEMP 'PixelComposer.iss'
          @"
          [Setup]
          AppId={{E835F723-4E41-47BE-9E63-0E0EF648CB58}
          AppName=Pixel Composer
          AppVersion=1.21.10.001
          AppPublisher=MakhamDev
          DefaultDirName={localappdata}\Programs\Pixel Composer
          DefaultGroupName=Pixel Composer
          UninstallDisplayIcon={app}\PixelComposer.exe
          OutputDir=$installerDir
          OutputBaseFilename=PixelComposer-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Files]
          Source: "$appRoot\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Pixel Composer"; Filename: "{app}\PixelComposer.exe"
          Name: "{autodesktop}\Pixel Composer"; Filename: "{app}\PixelComposer.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\PixelComposer.exe"; Description: "Launch Pixel Composer"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding utf8 $issPath

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = Join-Path $installerDir 'PixelComposer-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'PixelComposer-Setup.exe was not produced.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PixelComposer-Windows-Installer
          path: installer/PixelComposer-Setup.exe
          if-no-files-found: error

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: PixelComposer-Windows-Portable
          path: out/PixelComposer.zip
          if-no-files-found: error
