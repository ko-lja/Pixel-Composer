name: Build Pixel Composer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provide GameMaker SDF prefab
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Adeptus-Dominus/ChapterMaster.git "$env:RUNNER_TEMP\chaptermaster"
          git -C "$env:RUNNER_TEMP\chaptermaster" sparse-checkout set prefabs/io.gamemaker.sdfshaders-1.0.0
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\prefabs" | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\chaptermaster\prefabs\io.gamemaker.sdfshaders-1.0.0" "$env:GITHUB_WORKSPACE\prefabs\io.gamemaker.sdfshaders-1.0.0"

      - name: Validate committed runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apolloDir = Join-Path $env:GITHUB_WORKSPACE 'extensions\Apollo'
          $apolloYy = Join-Path $apolloDir 'Apollo.yy'
          $yyText = Get-Content -Raw $apolloYy

          $declaredFiles = [regex]::Matches($yyText, '"filename"\s*:\s*"([^"]+)"') |
            ForEach-Object { $_.Groups[1].Value } | Where-Object { $_ } | Sort-Object -Unique
          $proxyFiles = [regex]::Matches($yyText, '"\%Name"\s*:\s*"(Apollo(?:_x64)?\.(?:dll|so|dylib))"') |
            ForEach-Object { $_.Groups[1].Value } | Where-Object { $_ } | Sort-Object -Unique

          foreach ($file in @($declaredFiles) + @($proxyFiles)) {
            if (-not (Test-Path (Join-Path $apolloDir $file))) {
              throw "Apollo.yy references missing extension file: $file"
            }
          }

          foreach ($file in @('Apollo.dll', 'Apollo_x64.dll', 'apollo_buffer.gml', 'apollo_call.gml', 'apollo_core.gml', 'apollo_ref.gml', 'apollo_script_execute.gml')) {
            if (-not (Test-Path (Join-Path $apolloDir $file))) {
              throw "Required Apollo compatibility file is missing: $file"
            }
          }

          # This Apollo release predates modern GML function declarations.
          $callSource = Get-Content -Raw (Join-Path $apolloDir 'apollo_call.gml')
          if ($callSource -notmatch '(?m)^\s*#define\s+lua_call\s*$') {
            throw 'apollo_call.gml does not define the legacy lua_call script.'
          }

          $patreonFile = Join-Path $env:GITHUB_WORKSPACE 'extensions\patreon_key\patreon_key.gml'
          $privateKeysFile = Join-Path $env:GITHUB_WORKSPACE 'extensions\PRIVATE_KEYS\PRIVATE_KEYS.gml'
          if (-not (Test-Path $patreonFile) -or (Get-Content -Raw $patreonFile) -notmatch 'function\s+patreon_init_keys\s*\(') {
            throw 'Public Patreon extension stub is missing or invalid.'
          }
          if (-not (Test-Path $privateKeysFile) -or (Get-Content -Raw $privateKeysFile) -notmatch 'function\s+__init_private_keys\s*\(') {
            throw 'Public private-key extension stub is missing or invalid.'
          }

          $apolloHash = (Get-FileHash (Join-Path $apolloDir 'Apollo_x64.dll') -Algorithm SHA256).Hash
          "APOLLO_X64_SHA256=$apolloHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Committed Apollo x64 SHA256: $apolloHash"

      - name: Setup GameMaker / Igor
        id: igor
        uses: bscotch/igor-setup@v1.4.2
        with:
          access-key: ${{ secrets.ACCESS_KEY }}
          runtime-version: 2026.100.0.1098
          modules: windows
          cache: true

      - name: Build Pixel Composer
        id: build
        uses: bscotch/igor-build@v1.3.3
        with:
          user-dir: ${{ steps.igor.outputs.user-dir }}
          yyp-path: ${{ github.workspace }}/PixelComposer.yyp
          platform: windows
          config: Itch
          yyc: false
          name: PixelComposer.zip
          save-logs: true

      - name: Validate Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'pixelcomposer-package'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Expand-Archive -Force "$env:GITHUB_WORKSPACE\out\PixelComposer.zip" $packageDir

          $exe = Get-ChildItem -Path $packageDir -Recurse -Filter 'PixelComposer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'PixelComposer.exe was not found in the GameMaker package.' }
          $appRoot = $exe.Directory.FullName
          "APP_ROOT=$appRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $macLibraries = @(Get-ChildItem -Path $appRoot -Recurse -File -Include '*.dylib')
          if ($macLibraries.Count -gt 0) {
            throw "macOS libraries were included in the Windows package: $($macLibraries.FullName -join ', ')"
          }

          $dataWin = Join-Path $appRoot 'data.win'
          if (-not (Test-Path $dataWin)) { throw 'data.win was not found in the GameMaker package.' }
          $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dataWin))
          if ($ascii.Contains('libmacWindowManager.dylib')) {
            throw 'The Windows data.win still references libmacWindowManager.dylib.'
          }

          $packagedApollo = Join-Path $appRoot 'Apollo_x64.dll'
          if (-not (Test-Path $packagedApollo)) { throw 'Apollo_x64.dll was not included in the Windows package.' }
          $packagedApolloHash = (Get-FileHash $packagedApollo -Algorithm SHA256).Hash
          if ($packagedApolloHash -ne $env:APOLLO_X64_SHA256) {
            throw "Packaged Apollo_x64.dll differs from the committed runtime. Expected $env:APOLLO_X64_SHA256, got $packagedApolloHash"
          }

      - name: Smoke test portable Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pixelcomposer-portable-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pixelcomposer-portable-stderr.log'
          $process = Start-Process -FilePath "$env:APP_ROOT\PixelComposer.exe" -WorkingDirectory $env:APP_ROOT -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $hasWindow = $false

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { break }
            if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
              $hasWindow = $true
              Write-Host "Pixel Composer portable window detected: '$($process.MainWindowTitle)'"
              break
            }
          }

          $output = ''
          if (Test-Path $stdout) { $output += Get-Content -Raw $stdout }
          if (Test-Path $stderr) { $output += "`n" + (Get-Content -Raw $stderr) }
          if ($output -match 'Unable to find function|Could not locate initialization function|ERROR in action number|Fatal Error') {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Pixel Composer reported a startup error:`n$output"
          }
          if ($process.HasExited) { throw "PixelComposer.exe exited during portable startup with code $($process.ExitCode).`n$output" }
          if (-not $hasWindow) {
            Stop-Process -Id $process.Id -Force
            throw "PixelComposer.exe stayed alive but did not create a top-level window.`n$output"
          }
          Stop-Process -Id $process.Id -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          $issPath = Join-Path $env:RUNNER_TEMP 'PixelComposer.iss'
          @"
          [Setup]
          AppId={{E835F723-4E41-47BE-9E63-0E0EF648CB58}
          AppName=Pixel Composer
          AppVersion=1.21.10.001
          AppPublisher=MakhamDev
          DefaultDirName={localappdata}\Programs\Pixel Composer
          DefaultGroupName=Pixel Composer
          UninstallDisplayIcon={app}\PixelComposer.exe
          OutputDir=$installerDir
          OutputBaseFilename=PixelComposer-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Files]
          Source: "$env:APP_ROOT\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Pixel Composer"; Filename: "{app}\PixelComposer.exe"
          Name: "{autodesktop}\Pixel Composer"; Filename: "{app}\PixelComposer.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\PixelComposer.exe"; Description: "Launch Pixel Composer"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding utf8 $issPath

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = Join-Path $installerDir 'PixelComposer-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'PixelComposer-Setup.exe was not produced.' }
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and launch Windows installer artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'pixelcomposer-installed'
          if (Test-Path $installRoot) { Remove-Item -Recurse -Force $installRoot }

          $install = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Pixel Composer installer exited with code $($install.ExitCode)." }

          $installedExe = Join-Path $installRoot 'PixelComposer.exe'
          if (-not (Test-Path $installedExe)) { throw "Installer completed but PixelComposer.exe was not installed at $installedExe" }

          $stdout = Join-Path $env:RUNNER_TEMP 'pixelcomposer-installed-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pixelcomposer-installed-stderr.log'
          $process = Start-Process -FilePath $installedExe -WorkingDirectory $installRoot -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $hasWindow = $false

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { break }
            if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
              $hasWindow = $true
              Write-Host "Installed Pixel Composer window detected: '$($process.MainWindowTitle)'"
              break
            }
          }

          $output = ''
          if (Test-Path $stdout) { $output += Get-Content -Raw $stdout }
          if (Test-Path $stderr) { $output += "`n" + (Get-Content -Raw $stderr) }
          if ($output -match 'Unable to find function|Could not locate initialization function|ERROR in action number|Fatal Error') {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Installed Pixel Composer reported a startup error:`n$output"
          }
          if ($process.HasExited) { throw "Installed PixelComposer.exe exited during startup with code $($process.ExitCode).`n$output" }
          if (-not $hasWindow) {
            Stop-Process -Id $process.Id -Force
            throw "Installed PixelComposer.exe stayed alive but did not create a top-level window.`n$output"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Installed Pixel Composer launched successfully and created a visible top-level window.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PixelComposer-Windows-Installer
          path: installer/PixelComposer-Setup.exe
          if-no-files-found: error

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: PixelComposer-Windows-Portable
          path: out/PixelComposer.zip
          if-no-files-found: error
